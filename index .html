
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aarti AI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #17132f, #402060, #101a35);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      padding: 24px;
      border: 1px solid #7863a8;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 40px #0005;
    }

    h1 {
      text-align: center;
      color: #d8b4fe;
    }

    .subtitle {
      text-align: center;
      color: #ddd6fe;
    }

    #chat {
      height: 280px;
      overflow-y: auto;
      padding: 12px;
      margin: 20px 0;
      border-radius: 14px;
      background: #100d24;
    }

    .message {
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    .user {
      background: #493078;
    }

    .ai {
      background: #24334d;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #c084fc;
      color: #190d2c;
      font-weight: bold;
    }

    #status {
      color: #ddd6fe;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>✨ Aarti AI</h1>
    <p class="subtitle">आपकी अपनी AI सहायक</p>

    <div id="chat" aria-live="polite">
      <div class="message ai">
        नमस्ते! 🙏 मैं Aarti AI हूँ।
        आप मुझसे क्या पूछना चाहते हैं?
      </div>
    </div>

    <div class="controls">
      <input id="question" placeholder="यहाँ लिखें..."
        aria-label="अपना सवाल लिखें">
      <button id="send">भेजें</button>
    </div>

    <p id="status">
      यह शुरुआती डेमो है। असली AI अभी कनेक्ट नहीं है।
    </p>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("question");
    const send = document.getElementById("send");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function reply() {
      const question = input.value.trim();

      if (!question) {
        input.focus();
        return;
      }

      addMessage(question, "user");
      input.value = "";

      addMessage(
        "आपका सवाल मिल गया! 😊 असली AI से जवाब पाने के लिए अभी AI सेवा कनेक्ट करनी होगी।",
        "ai"
      );
    }

    send.addEventListener("click", reply);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        reply();
      }
    });
  </script>
</body>
</html>
